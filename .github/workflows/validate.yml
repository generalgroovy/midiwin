name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q midiwin midiwin-gui.py
      - run: python -m midiwin --validate-config --config config.default.json
      - run: python -m pytest -v
      - name: Build executable
        shell: powershell
        run: .\build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MIDIWIN-windows
          path: dist/MIDIWIN
          if-no-files-found: error
